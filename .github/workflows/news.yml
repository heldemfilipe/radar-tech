name: Resumo Tech Diário

on:
  schedule:
    # 09:45 UTC = 06:45 BRT. O cron do Actions NÃO é pontual (atrasa 5 a
    # 40 min na fila), então disparamos 15 min antes pra entrega real
    # cair em torno das 07:00.
    - cron: "45 9 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions (pra testar)

permissions:
  contents: write   # necessário só pro keepalive (commit dummy a cada 50 dias)

jobs:
  resumo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar e enviar resumo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # O GitHub DESATIVA workflows agendados após 60 dias sem commits
      # no repo. Se o último commit tiver mais de 50 dias, este step faz
      # um commit vazio pra manter o cron vivo. Sem actions de terceiros.
      - name: Keepalive (evita desativação por inatividade)
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Último commit há $days dia(s)"
          if [ "$days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: mantém o cron ativo"
            git push
          fi
